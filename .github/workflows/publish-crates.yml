name: Publish crates

# Merging version bumps to main is a crates release. On every push to main this
# plans the release; if any crate's version is not on crates.io yet, it checks
# semver, waits for `crates-io` environment approval, publishes, then tags each
# published crate as `<crate>-v<version>`. Each `run:` step is one command;
# release logic lives in `cargo xtask crates` (xtask/).
#
# setup-rust-toolchain's cache is off in every job: caches are writable from
# other workflows, and `publish` and `tag` hold a crates.io or `contents: write`
# token. The semver job, which holds no token, keeps cargo-semver-checks'
# own baseline cache; a poisoned cache could at worst make that check pass.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time. While a run waits for approval, a newer run
# queues behind it; a still newer run replaces that queued one. Each run plans
# from its own commit, so the replaced run's crates are planned again.
concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    if: github.repository == 'inkandswitch/subduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      planned: ${{ steps.plan.outputs.planned }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - name: Check Cargo.lock and internal dependency requirements
        run: cargo xtask crates validate

      # Fails if any crate has never been published (first publish is manual).
      - name: Plan the release
        id: plan
        run: cargo xtask crates plan

  semver:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      # Fails if any crate's version bump is too small for its API changes
      # since its latest crates.io release.
      - name: Check semver against crates.io
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: manual

  publish:
    needs: [plan, semver]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      # Build the release tool before the crates.io token exists, so xtask's
      # own build scripts never see CARGO_REGISTRY_TOKEN. `cargo publish` still
      # builds each published crate, and its dependencies, with the token set.
      - name: Build the release tool
        run: cargo build --locked --package xtask

      - name: Get a short-lived crates.io token (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Skips versions already on crates.io, so re-running finishes a partial release.
      - name: Publish unpublished crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo xtask crates publish

  tag:
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - name: Build the release tool
        run: cargo build --locked --package xtask

      # Tags this run's commit through the GitHub API. Tags made with
      # GITHUB_TOKEN do not trigger other workflows.
      - name: Tag each published crate as <crate>-v<version>
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLANNED: ${{ needs.plan.outputs.planned }}
        # PLANNED is "<crate>@<version> ...", produced by `xtask crates plan`;
        # it is split into one argument per release on purpose.
        run: cargo xtask crates tag $PLANNED
