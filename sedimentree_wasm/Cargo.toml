[package]
name = "sedimentree_wasm"
version = "0.19.0"
description = "Wasm/JavaScript bindings for Sedimentree (browser and Node.js)"
categories = ["web-programming"]
keywords = ["sedimentree", "wasm"]
readme = "./README.md"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = { workspace = true }
future_form = { workspace = true }
js-sys = { workspace = true }
sedimentree_core = { workspace = true }
subduction_core = { workspace = true }
subduction_crypto = { workspace = true }
subduction_wasm_bootstrap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = []
std = [
  "futures/std",
  "js-sys/std",
  "sedimentree_core/std",
  "subduction_core/std",
  "subduction_crypto/std",
  "thiserror/std",
  "wasm-bindgen/std",
  "wasm-bindgen-futures/std",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-multivalue",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-sign-ext",
  "--enable-simd",
]

[lints]
workspace = true
