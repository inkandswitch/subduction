[package]
name = "subduction_keyhive"
version = "0.13.0"
description = "Keyhive protocol"

categories = ["web-programming"]
keywords = ["sync", "subduction"]
readme = "./README.md"

edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true, features = ["derive"] }
async-channel = { workspace = true, optional = true }
async-lock = { workspace = true }
base64 = { workspace = true }
bijoux = { workspace = true }
blake3 = { workspace = true }
bolero = { workspace = true, optional = true, features = ["arbitrary"] }
dhat = { workspace = true, optional = true }
dupe = "0.9"
ed25519-dalek = { workspace = true, optional = true }
future_form = { workspace = true }
futures = { workspace = true }
keyhive_codec = { workspace = true }
keyhive_content = { workspace = true }
keyhive_core = { workspace = true }
keyhive_crypto = { workspace = true }
keyline = { workspace = true }
keyline_memory = { workspace = true, optional = true }
nonempty = { workspace = true }
rand = { workspace = true }
sedimentree_core = { workspace = true }
subduction_core = { workspace = true }
subduction_crypto = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true, features = ["attributes"] }

[features]
default = []
arbitrary = ["dep:arbitrary", "std"]
bolero = ["arbitrary", "dep:bolero"]
handler = [
  "dep:keyline_memory",
  "dep:subduction_crypto",
  "std",
]
runtime = ["handler", "dep:tokio"]
std = [
  "keyhive_codec/std",
  "keyhive_content/std",
  "keyhive_crypto/std",
  "keyline/std",
  "keyline_memory?/std",
  "rand/std",
  "thiserror/std",
]
test-utils = [
  "dep:async-channel",
  "dep:ed25519-dalek",
  "dep:keyline_memory",
  "std",
  "subduction_core/test_utils",
]
# In-crate heap-profiling harness (the periodic-cache serving/refresh membench
# in cache/membench.rs). Installs dhat as the global allocator. Run with:
#   cargo test -p subduction_keyhive --release --features test-utils,dhat-heap \
#       serving_membench -- --nocapture --exact
dhat-heap = ["dep:dhat", "test-utils"]

[dev-dependencies]
async-channel = { workspace = true }
criterion = { workspace = true }
ed25519-dalek = { workspace = true }
nonempty = { workspace = true }
subduction_core = { workspace = true, features = ["std", "test_utils"] }
subduction_crypto = { workspace = true }
testresult = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "e2e"
required-features = ["runtime", "test-utils"]

[[test]]
name = "keyhive_wasm_interop"
required-features = ["runtime"]

[[bench]]
name = "periodic_cache"
harness = false
required-features = ["test-utils"]

[lints]
workspace = true
