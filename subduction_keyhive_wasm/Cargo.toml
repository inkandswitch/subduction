[package]
name = "subduction_keyhive_wasm"
version = "0.1.0"
description = "Wasm bindings for Keyhive with Subduction's keyhive sync protocol"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-lock = { workspace = true }
future_form = { workspace = true }
futures = { workspace = true }
js-sys = { workspace = true }
keyhive_core = { workspace = true }
keyhive_wasm = { workspace = true }
keyline_memory = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["std", "std_rng"] }
subduction_keyhive = { workspace = true, features = ["serde", "std"] }
thiserror = { workspace = true, features = ["std"] }
wasm-bindgen = { workspace = true, features = ["std"] }
wasm-bindgen-futures = { workspace = true, features = ["std"] }
