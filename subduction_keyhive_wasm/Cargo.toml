[package]
name = "subduction_keyhive_wasm"
version = "0.1.0"
description = "Wasm bindings for Subduction's keyhive sync protocol over a keyhive in JavaScript"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-lock = { workspace = true }
dupe = "0.9"
future_form = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true, features = ["js"] }
js-sys = { workspace = true }
keyhive_crypto = { workspace = true }
subduction_keyhive = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
