[package]
name = "subduction_runtime"
version = "0.1.0"
description = "Generic async driver for the Subduction sans-io state machine: tagless-final traits over FutureForm, actor funnel, effect executors"

categories = ["asynchronous", "network-programming"]
keywords = ["sans-io", "subduction", "sync"]
readme = "./README.md"
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
metrics = ["dep:metrics"]

[dependencies]
async-channel = { workspace = true }
ed25519-dalek = { workspace = true, features = ["std"] }
future_form = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true, optional = true }
sedimentree_core = { workspace = true, features = ["std"] }
subduction_crypto = { workspace = true, features = ["std"] }
subduction_protocol = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["attributes"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor", "thread-pool"] }
testresult = { workspace = true }

[lints]
workspace = true
